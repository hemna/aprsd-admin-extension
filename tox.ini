[tox]
minversion = 4.30.0
skipdist = True
skip_missing_interpreters = true
envlist = lint,py{311,312,313,314}
requires = tox-uv

# Activate isolated build environment. tox will use a virtual environment
# to build a source distribution from the source tree. For build tools and
# arguments use the pyproject.toml file as specified in PEP-517 and PEP-518.
isolated_build = true

[testenv]
runner = uv-venv-lock-runner
description = Run unit-testing with pytest
setenv =
    PYTHONDONTWRITEBYTECODE=1
    PYTHONUNBUFFERED=1
extras =
    dev
commands =
    # Use -bb to enable BytesWarnings as error to catch str/bytes misuse.
    # Use -Werror to treat warnings as errors.
    {envpython} -bb -Werror -m pytest -v {posargs}

# This is the configuration for the tox-gh-actions plugin for GitHub Actions
#   https://github.com/ymyzk/tox-gh-actions
# This section is not needed if not using GitHub Actions for CI.
[gh-actions]
python =
    3.11: py311, lint, type-check, docs
    3.12: py312, lint, type-check, docs
    3.13: py313, lint, type-check, docs
    3.14: py314, lint, type-check, docs

[testenv:type-check]
runner = uv-venv-lock-runner
description = Run type checker via mypy
extras =
    dev
commands =
    mypy aprsd_admin_extension tests

[testenv:lint]
runner = uv-venv-lock-runner
description = Run ruff linter and formatter checks
commands =
  ruff check aprsd_admin_extension tests {posargs}
  ruff format --check aprsd_admin_extension tests

[testenv:docs]
runner = uv-venv-lock-runner
description = Build documentation
extras =
    dev
changedir = {toxinidir}/docs
commands =
    {envpython} clean_docs.py
    m2r2 --overwrite {toxinidir}/README.md
    {envpython} -c "import shutil, os; os.chdir('{toxinidir}'); shutil.move('README.rst', 'docs/source/readme.rst')"
    {envpython} fix_readme_rst.py
    sphinx-apidoc --force --output-dir source/apidoc {toxinidir}/aprsd_admin_extension
    #sphinx-build -a -W . _build
    sphinx-build -M html source build

[testenv:fmt]
runner = uv-venv-lock-runner
description = Auto-fix code formatting and linting errors using ruff
commands =
    ruff format aprsd_admin_extension tests
    ruff check --fix aprsd_admin_extension tests

[testenv:licenses]
runner = uv-venv-lock-runner
description = Generate license report
extras =
    dev
commands =
    uv pip install pip-licenses
    pip-licenses {posargs}
